---
# tasks file for roles/ys1
- name: Git clone YS1 # noqa latest[git]
  ansible.builtin.git:
    repo: https://github.com/YumaYX/YS1.git
    dest: /work/downloads/YS1
  become: true
  become_user: "{{ prime_user }}"

- name: Configure Bundler to use the system gem path
  ansible.builtin.command:
    cmd: /home/{{ prime_user }}/.rbenv/shims/bundle config set --local path.system true
    chdir: /work/downloads/YS1
  become: true
  become_user: "{{ prime_user }}"
  changed_when: false

- name: Install Ruby dependencies with Bundler
  ansible.builtin.command:
    cmd: /home/{{ prime_user }}/.rbenv/shims/bundle install
    chdir: /work/downloads/YS1
  become: true
  become_user: "{{ prime_user }}"
  register: ys1_bundle_install
  changed_when: "'Installing' in ys1_bundle_install.stdout"

- name: Check if ys1 gem is installed
  ansible.builtin.command: /home/{{ prime_user }}/.rbenv/shims/gem list -i ys1
  become: true
  become_user: "{{ prime_user }}"
  register: ys1_gem
  changed_when: false
  failed_when: false

- name: Rake install local
  ansible.builtin.command: /home/{{ prime_user }}/.rbenv/shims/bundle exec rake install:local
  args:
    chdir: /work/downloads/YS1
  become: true
  become_user: "{{ prime_user }}"
  changed_when: true
  when: ys1_gem.stdout | trim != 'true'
