---
- name: Ensure the primary user exists
  ansible.builtin.user:
    name: "{{ prime_user }}"
    shell: /bin/bash

- name: Create workspace directories
  ansible.builtin.file:
    path: /work/{{ item }}
    state: directory
    owner: "{{ prime_user }}"
    group: "{{ prime_user }}"
    mode: "0755"
  loop:
    - lib
    - data
    - output
    - downloads
    - sandbox
