---
- name: Ensure the primary user exists
  ansible.builtin.user:
    name: "{{ prime_user }}"
    password: "{{ prime_user_password }}"
    shell: /bin/bash

- name: Create the Ansible temporary directory
  ansible.builtin.file:
    path: /home/{{ prime_user }}/.ansible/tmp
    state: directory
    owner: "{{ prime_user }}"
    group: "{{ prime_user }}"
    mode: "0700"

- name: Configure sudo access
  ansible.builtin.template:
    src: templates/sudo.j2
    dest: /etc/sudoers.d/{{ prime_user }}
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Create the .ssh directory
  ansible.builtin.file:
    path: /home/{{ prime_user }}/.ssh
    state: directory
    owner: "{{ prime_user }}"
    group: "{{ prime_user }}"
    mode: "0700"

- name: Generate an ED25519 SSH key
  community.crypto.openssh_keypair:
    path: /home/{{ prime_user }}/.ssh/id_ed25519
    type: ed25519
    passphrase: ""
    owner: "{{ prime_user }}"
    group: "{{ prime_user }}"
    mode: "0600"
  become: true
  become_user: "{{ prime_user }}"
  register: user_ssh_key

- name: Set SSH key permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ prime_user }}"
    group: "{{ prime_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: /home/{{ prime_user }}/.ssh/id_ed25519
      mode: "0600"
    - path: /home/{{ prime_user }}/.ssh/id_ed25519.pub
      mode: "0644"

- name: Authorize the generated public key
  ansible.posix.authorized_key:
    user: "{{ prime_user }}"
    key: "{{ user_ssh_key.public_key }}"
    state: present
    manage_dir: true

- name: Clone the dotfiles repository # noqa latest[git]
  ansible.builtin.git:
    repo: https://github.com/YumaYX/dotfiles.git
    dest: /work/lib/dotfiles
  become: true
  become_user: "{{ prime_user }}"

- name: Install dotfiles
  community.general.make:
    chdir: /work/lib/dotfiles
    target: install
  become: true
  become_user: "{{ prime_user }}"

- name: Clone the YS10 repository # noqa latest[git]
  ansible.builtin.git:
    repo: https://github.com/YumaYX/YS10.git
    dest: /work/lib/YS10
  become: true
  become_user: "{{ prime_user }}"

- name: Install YS10
  community.general.make:
    chdir: /work/lib/YS10
    target: install
  become: true
