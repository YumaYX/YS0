---
# tasks file for roles/rust
- name: Install GCC
  ansible.builtin.dnf:
    name: gcc
    state: present

- name: Install Rust
  ansible.builtin.shell: |
    set -o pipefail
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
  args:
    executable: /bin/bash
    creates: /home/{{ prime_user }}/.cargo/bin/rustc
  become: true
  become_user: "{{ prime_user }}"
