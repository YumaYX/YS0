---
# tasks file for roles/kvm
- name: Add hashicorp repo
  ansible.builtin.get_url:
    url: https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo
    dest: /etc/yum.repos.d/hashicorp.repo
    mode: "0644"

- name: Install tools for kvm + vagrant
  ansible.builtin.dnf:
    name:
      - libvirt
      - libvirt-devel
      - qemu-kvm
      - vagrant
      - virt-install
      - virt-manager
    state: present

- name: Start libvirtd
  ansible.builtin.systemd_service:
    name: libvirtd
    enabled: true
    state: started

- name: Add existing user to the group
  ansible.builtin.user:
    name: "{{ prime_user }}"
    groups: libvirt
    append: true
    state: present

- name: Check if vagrant-libvirt is already installed
  ansible.builtin.command: vagrant plugin list
  register: kvm_vagrant_plugins
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ prime_user }}"

- name: Install vagrant-libvirt if not present
  ansible.builtin.command: vagrant plugin install vagrant-libvirt
  changed_when: true
  become: true
  become_user: "{{ prime_user }}"
  when: "'vagrant-libvirt' not in kvm_vagrant_plugins.stdout"
