---
- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Install NFS utilities
  ansible.builtin.dnf:
    name: nfs-utils
    state: present

- name: Configure /etc/exports
  ansible.builtin.blockinfile:
    path: /etc/exports
    marker: "# Ansible {mark}"
    create: true
    mode: "0644"
    block: |
      /nfs *(rw,all_squash,async)
  notify: Restart NFS server

- name: Create the NFS directory
  ansible.builtin.file:
    path: /nfs
    state: directory
    owner: nobody
    group: nobody
    mode: "0777"

- name: Enable and start rpcbind and nfs-server
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - rpcbind
    - nfs-server

- name: Allow NFS through the firewall
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop:
    - nfs
    - rpc-bind
    - nfs3
    - mountd
