---
# tasks file for roles/init
- name: Set hostname
  ansible.builtin.hostname:
    name: y.localdomain

- name: Configure dnf
  ansible.builtin.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - option: fastestmirror
      value: 'True'
    - option: max_parallel_downloads
      value: '10'

- name: Schedule dnf update
  ansible.builtin.cron:
    name: dnf-update-cron
    minute: "0"
    hour: "4"
    job: dnf -y update

- name: Install tools
  ansible.builtin.dnf:
    name:
      - firewalld
      - make
      - vim
      - jq
      - cronie
      - "@Development Tools"
    state: present

- name: Start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started
