---
- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Allow HTTP through the firewall
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true

- name: Install httpd
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Enable and start httpd
  ansible.builtin.systemd_service:
    name: httpd
    state: started
    enabled: true
