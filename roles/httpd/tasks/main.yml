---
# Tasks file for managing HTTPD

- name: Configure firewalld for HTTP
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true

- name: Install HTTPD package
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Enable and start HTTPD service
  ansible.builtin.systemd_service:
    name: httpd
    state: started
    enabled: true
