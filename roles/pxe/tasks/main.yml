---
# Ansible playbook for configuring PXE boot server

- name: Install PXE packages
  ansible.builtin.dnf:
    name:
      - tftp-server
      - dhcp-server
      - firewalld
    state: present

- name: Start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Configure firewalld for PXE services
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - tftp
    - dhcp

- name: Create PXE directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /tmp/rpm
    - /var/pxe/linux9
    - /var/lib/tftpboot/linux9
    - /var/www/html/ks

- name: Fetch and extract PXE boot loaders
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p /tmp/rpm
    cd /tmp/rpm
    dnf -y reinstall --downloadonly --downloaddir=/tmp/rpm shim grub2-efi-x64
    rpm2cpio shim-x64-*.rpm | cpio -dimv
    rpm2cpio grub2-efi-x64-*.rpm | cpio -dimv
  args:
    executable: /bin/bash
    creates: /tmp/rpm/boot/efi/EFI/BOOT/BOOTX64.EFI

- name: Copy BOOTX64.EFI
  ansible.builtin.copy:
    src: /tmp/rpm/boot/efi/EFI/BOOT/BOOTX64.EFI
    dest: /var/lib/tftpboot/BOOTX64.EFI
    remote_src: true
    mode: "0644"

- name: Copy grubx64.efi
  ansible.builtin.copy:
    src: /tmp/rpm/boot/efi/EFI/almalinux/grubx64.efi
    dest: /var/lib/tftpboot/grubx64.efi
    remote_src: true
    mode: "0644"

- name: Download AlmaLinux ISO
  ansible.builtin.get_url:
    url: https://ftp.riken.jp/Linux/almalinux/9.4/isos/x86_64/AlmaLinux-9-latest-x86_64-minimal.iso
    dest: /tmp/linux9.iso
    mode: "0644"

- name: Mount AlmaLinux DVD read-only
  ansible.posix.mount:
    src: /tmp/linux9.iso
    path: /var/pxe/linux9
    fstype: iso9660
    opts: loop,ro
    state: mounted

- name: Copy kernel and initrd
  ansible.builtin.copy:
    src: /var/pxe/linux9/images/pxeboot/{{ item }}
    dest: /var/lib/tftpboot/linux9/{{ item }}
    remote_src: true
    mode: "0644"
  loop:
    - vmlinuz
    - initrd.img

- name: Configure dhcpd.conf
  ansible.builtin.template:
    src: templates/dhcpd.conf.j2
    dest: /etc/dhcp/dhcpd.conf
    mode: "0644"
  notify: Restart DHCP

- name: Configure grub.cfg
  ansible.builtin.template:
    src: templates/grub.cfg.j2
    dest: /var/lib/tftpboot/grub.cfg
    mode: "0644"

- name: Configure pxeboot.conf
  ansible.builtin.template:
    src: templates/pxeboot.conf.j2
    dest: /etc/httpd/conf.d/pxeboot.conf
    mode: "0644"
  notify: Restart HTTPD

- name: Configure ks.cfg
  ansible.builtin.template:
    src: templates/ks.cfg.j2
    dest: /var/www/html/ks/ks.cfg
    mode: "0644"
  notify: Restart HTTPD

- name: Enable and start PXE services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - tftp
    - dhcpd
