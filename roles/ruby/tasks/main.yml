---
# tasks file for roles/ruby
- name: Install dnf plugins
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Ensure CRB repository is enabled
  community.general.dnf_config_manager:
    name: crb
    state: enabled

- name: Install packages for Ruby
  ansible.builtin.dnf:
    name:
      - bzip2
      - gcc
      - openssl-devel
      - readline-devel
      - zlib-devel
      - libyaml-devel
      - git
      - rust
      - cargo
      - ruby-devel
      - libffi-devel
    state: present

- name: Git clone rbenv # noqa latest[git]
  ansible.builtin.git:
    repo: https://github.com/rbenv/rbenv.git
    dest: /home/{{ prime_user }}/.rbenv
  become: true
  become_user: "{{ prime_user }}"

- name: Git clone ruby-build # noqa latest[git]
  ansible.builtin.git:
    repo: https://github.com/rbenv/ruby-build.git
    dest: /home/{{ prime_user }}/.rbenv/plugins/ruby-build
  become: true
  become_user: "{{ prime_user }}"

- name: Check installed Ruby versions
  ansible.builtin.command: /home/{{ prime_user }}/.rbenv/bin/rbenv versions --bare
  become: true
  become_user: "{{ prime_user }}"
  register: ruby_rbenv_versions
  changed_when: false
  failed_when: false

- name: Install Ruby
  ansible.builtin.command: /home/{{ prime_user }}/.rbenv/bin/rbenv install {{ ruby_version }}
  environment:
    CONFIGURE_OPTS: '--disable-install-doc'
  become: true
  become_user: "{{ prime_user }}"
  changed_when: true
  when: ruby_version not in ruby_rbenv_versions.stdout_lines

- name: Check global Ruby version
  ansible.builtin.command: /home/{{ prime_user }}/.rbenv/bin/rbenv global
  become: true
  become_user: "{{ prime_user }}"
  register: ruby_rbenv_global
  changed_when: false
  failed_when: false

- name: Set global Ruby version
  ansible.builtin.command: /home/{{ prime_user }}/.rbenv/bin/rbenv global {{ ruby_version }}
  become: true
  become_user: "{{ prime_user }}"
  changed_when: true
  when: ruby_rbenv_global.stdout | trim != ruby_version

- name: Install bundler gem
  community.general.gem:
    name: bundler
    executable: /home/{{ prime_user }}/.rbenv/shims/gem
    user_install: false
  become: true
  become_user: "{{ prime_user }}"

- name: Create update-rubygems script
  ansible.builtin.copy:
    dest: /usr/local/bin/update-rubygems
    content: |
      #!/usr/bin/env bash
      export RBENV_ROOT="$HOME/.rbenv"
      export PATH="$RBENV_ROOT/bin:$PATH"
      eval "$(rbenv init -)"
      gem update --system
      gem update
    owner: "{{ prime_user }}"
    group: "{{ prime_user }}"
    mode: "0755"

- name: Gem update - cron
  ansible.builtin.cron:
    name: gem-update-cron
    minute: "0"
    hour: "18"
    weekday: "5"
    job: /usr/local/bin/update-rubygems
    user: "{{ prime_user }}"
