---
# tasks file for roles/homebrew
- name: Install tools
  ansible.builtin.dnf:
    name:
      - procps-ng
      - curl
      - file
      - "@Development Tools"
    state: present

- name: Create linuxbrew user
  ansible.builtin.user:
    name: linuxbrew
    shell: /bin/bash
    create_home: true
    home: /home/linuxbrew
    state: present

- name: Download Linuxbrew install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
    dest: /tmp/install_linuxbrew.sh
    mode: '0777'

- name: Install Linuxbrew
  ansible.builtin.command: /bin/bash /tmp/install_linuxbrew.sh
  environment:
    CI: "1"
  args:
    creates: /home/linuxbrew/.linuxbrew/bin/brew
  failed_when: false
  become_user: linuxbrew
  become: true

- name: Set /home/linuxbrew permissions
  ansible.builtin.file:
    path: /home/linuxbrew
    mode: '0757'
    state: directory

- name: Recursively set permissions for .linuxbrew
  ansible.builtin.file:
    path: /home/linuxbrew/.linuxbrew
    mode: '0757'
    recurse: true
    state: directory

- name: Ensure Linuxbrew eval is in .bashrc
  ansible.builtin.blockinfile:
    path: /home/linuxbrew/.bashrc
    block: |
      test -d ~/.linuxbrew && eval "$(~/.linuxbrew/bin/brew shellenv)"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE LINUXBREW INIT"
  become_user: linuxbrew
  become: true
