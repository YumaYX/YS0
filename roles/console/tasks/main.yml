---
# tasks file for roles/console
- name: Set console font in /etc/vconsole.conf
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^FONT='
    line: 'FONT="latarcyrheb-sun32"'
    state: present
    create: true

- name: Restart systemd-vconsole-setup
  ansible.builtin.systemd_service:
    name: systemd-vconsole-setup
    state: restarted

