name: init

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    timeout-minutes: 360
    steps:
      - name: Verify environment
        run: cat /etc/redhat-release

      - name: Install prerequisites
        run: dnf -y install curl sudo

      - name: Run init.sh
        run: curl -fsSL https://raw.githubusercontent.com/YumaYX/YS0/main/init.sh | sudo sh
