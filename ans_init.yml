---
- name: Check environment
  hosts: all
  gather_facts: false
  tasks:
    - name: Detect virtualization
      ansible.builtin.command: systemd-detect-virt
      register: virt_check
      changed_when: false
      failed_when: false

- name: Set up the development machine
  hosts: all
  roles:
    - init
    - console
    - workspace
    - user
    - ruby
    - ys1
    - samba
    - role: kvm
      when: virt_check.stdout == "none"
      ignore_errors: true
    - serverspec
